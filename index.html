<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeutschQuest 2.0</title>
  <meta name="theme-color" content="#2f6fed" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Deutschprofis Lernwelt</p>
        <h1>DeutschQuest 2.0</h1>
      </div>
      <div class="profile-card">
        <div class="avatar">DQ</div>
        <div>
          <strong id="playerName">Schülerin</strong>
          <span id="levelText">Level 1</span>
        </div>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar card">
        <h2>QuestPass</h2>
        <div class="stat-grid">
          <div><span id="xp">0</span><small>XP</small></div>
          <div><span id="streak">0</span><small>Streak</small></div>
          <div><span id="hearts">5</span><small>Leben</small></div>
          <div><span id="badges">0</span><small>Medaillen</small></div>
        </div>
        <div class="progress-wrap">
          <div class="progress-label"><span>Fortschritt</span><span id="progressPercent">0%</span></div>
          <div class="progress"><div id="progressBar"></div></div>
        </div>
        <label class="name-box">Name der Schülerin
          <input id="nameInput" type="text" placeholder="z. B. Emilia" />
        </label>
        <button id="saveName" class="secondary">Speichern</button>
      </aside>

      <section class="map card">
        <div class="section-title">
          <div>
            <p class="eyebrow">Reise durch D-A-CH</p>
            <h2>Wähle deine Stadt</h2>
          </div>
          <button id="reset" class="ghost">Neu starten</button>
        </div>
        <div id="cityGrid" class="city-grid"></div>
      </section>

      <section class="trainer card">
        <div class="section-title">
          <div>
            <p class="eyebrow" id="lessonMeta">A1 · Lektion 1</p>
            <h2 id="lessonTitle">Start</h2>
          </div>
          <div class="mode-tabs">
            <button class="mode active" data-mode="choice">Übersetzen</button>
            <button class="mode" data-mode="write">Schreiben</button>
            <button class="mode" data-mode="sentence">Satz</button>
          </div>
        </div>

        <div id="questionCard" class="question-card">
          <p id="questionType">Was bedeutet?</p>
          <h3 id="questionWord">Hallo</h3>
          <div id="options" class="options"></div>
          <div id="writeArea" class="write-area hidden">
            <input id="answerInput" type="text" placeholder="Antwort schreiben…" />
            <button id="checkWrite">Prüfen</button>
          </div>
          <p id="feedback" class="feedback"></p>
          <button id="next" class="primary hidden">Weiter</button>
        </div>
      </section>
    </main>
  </div>

  <script src="data/vocabulary.js"></script>
  <script src="app.js"></script>
</body>
</html>
