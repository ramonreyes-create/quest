<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeutschQuest 3.0 · Sprint 1</title>
  <meta name="theme-color" content="#243b7a">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/styles.css?v=3.1.0">
</head>
<body>
  <div id="app" class="app">
    <aside class="side">
      <div class="brand"><div class="logo">DQ</div><div><strong>DeutschQuest</strong><span>3.0 · Sprint 1</span></div></div>
      <button class="nav active" data-view="dashboard">🏠 Start</button>
      <button class="nav" data-view="map">🗺️ DACH-Karte</button>
      <button class="nav" data-view="questpass">📘 QuestPass</button>
      <button class="nav" data-view="library">📚 Bibliothek</button>
      <button class="nav" data-view="profile">👤 Profil</button>
      <button class="nav" data-view="teacher">👩‍🏫 Lehrerbereich</button>
      <button class="nav" data-view="settings">⚙️ Einstellungen</button>
      <div class="install"><p>Als App installieren</p><button id="installBtn" disabled>Installieren</button></div>
    </aside>
    <main>
      <header class="top">
        <div><p class="kicker">Deine Reise durch die deutschsprachige Welt</p><h1 id="viewTitle">Hallo!</h1></div>
        <div class="pills"><span id="hearts"></span><span id="xp"></span><span id="coins"></span><span id="level"></span><span id="streak"></span></div>
      </header>
      <section id="dashboard" class="view active"></section>
      <section id="map" class="view"></section>
      <section id="questpass" class="view"></section>
      <section id="library" class="view"></section>
      <section id="profile" class="view"></section>
      <section id="teacher" class="view"></section>
      <section id="settings" class="view"></section>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <script type="module" src="js/app.js?v=3.1.0"></script>
</body>
</html>
